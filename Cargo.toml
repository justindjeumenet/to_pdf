[package]
name = "to_pdf"
version = "0.1.0"
edition = "2024"

[lib]
name = "to_pdf"
path = "src/lib.rs"

[[bin]]
name = "to_pdf"
path = "src/main.rs"

[dependencies]
flate2 = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
